<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--p:#0f766e;--a:#f59e0b;--bg:#f4f7f6;--c:#fff;--t:#16302d;--m:#64807c;--b:#d9e4e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--c:#162826;--t:#e4f0ee;--m:#8fb0ab;--b:#27403d}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:18px}header small{opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--c);border-bottom:1px solid var(--b)}
nav button{white-space:nowrap;border:0;background:none;color:var(--m);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--p);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);max-width:100%}
button.b{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
button.d{background:none;border:0;color:#c0392b;cursor:pointer}
button.a{background:var(--a);color:#222}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-size:12px;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi div{background:var(--bg);border-radius:10px;padding:12px}.kpi b{font-size:26px;color:var(--p);display:block}
.login{max-width:360px;margin:8vh auto;text-align:center}.login input{width:100%;margin:5px 0}
.tag{background:var(--a);color:#222;border-radius:6px;padding:1px 7px;font-size:12px}
.num{width:70px}.bul h1{margin:0;color:var(--p);font-size:20px}.bul .hd{display:flex;justify-content:space-between;border-bottom:3px solid var(--p);padding-bottom:8px;margin-bottom:10px}
.red{color:#c0392b}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:10px}.g label{font-size:12px;color:var(--m)}.g input{width:100%;display:block;margin-top:2px}.ck label{display:inline-block;margin:2px 10px 2px 0;white-space:nowrap}td input{max-width:150px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>

const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);

let S={u:null,reg:false,fc:'',cy:'Collège',tab:'home',as:'',tri:'1',title:'',cls:'',stu:''};
const nm=(l,id)=>(db[l].find(x=>x.id==id)||{}).name||'—';
const myAs=()=>db.subjects.filter(s=>S.u.role!='prof'||s.teacher==S.u.id);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

const avgSub=(st,sb,tri)=>mean(db.grades.filter(g=>g.stu==st&&g.sub==sb&&(tri==0||g.tri==tri)).map(g=>g.v));
function gen(st,cls,tri){let n=0,d=0;db.subjects.filter(s=>s.cls==cls).forEach(s=>{const a=avgSub(st,s.id,tri);if(a!=null){n+=a*s.coef;d+=+s.coef}});return d?n/d:null}
const rank=(st,cls,tri)=>{const l=db.students.filter(x=>x.cls==cls).map(x=>gen(x.id,cls,tri)).filter(x=>x!=null).sort((a,b)=>b-a),m=gen(st,cls,tri);return m==null?null:l.indexOf(m)+1+'/'+l.length};
const appr=m=>m==null?'':m>=16?'Excellent travail, félicitations.':m>=14?'Très bons résultats, continuez ainsi.':m>=12?'Bon travail, ensemble satisfaisant.':m>=10?'Résultats satisfaisants, des efforts à poursuivre.':m>=8?'Résultats fragiles, un travail plus régulier est attendu.':'Résultats insuffisants, un net ressaisissement est nécessaire.';
const opt=(l,sel,fn)=>l.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(fn?fn(x):x.name)}</option>`).join('');

function render(){
 if(!S.u){const r=S.reg;$('app').innerHTML=`<div class="card login"><div style="font-size:44px">🎓</div><h2>Scolaria</h2><p style="color:var(--m)">${r?"Créer l'espace de votre établissement":'Notes, carnets & bulletins'}</p>${r?`<input id="rs" placeholder="Nom de l'établissement"><input id="rh" placeholder="Nom du responsable">`:''}<input id="lg" type="email" placeholder="Email" autocapitalize="none"><input id="pw" type="password" placeholder="Mot de passe (6+)"><button class="b" style="width:100%" onclick="${r?'register()':'login()'}">${r?'Créer mon espace':'Se connecter'}</button><p id="er" class="red"></p><button class="d" style="color:var(--p)" onclick="S.reg=!S.reg;render()">${r?'← Déjà un espace ? Se connecter':'Nouvel établissement ? Créer un espace'}</button></div>`;return}
 const tabs=TABS[S.u.role];if(!tabs.includes(S.tab))S.tab=tabs[0];
 $('app').innerHTML=`<header><div style="display:flex;gap:10px;align-items:center">${db.school.logo?`<img src="${db.school.logo}" height="38" style="border-radius:6px;background:#fff">`:'🎓'}<div><b>${esc(db.school.name||'Scolaria')}</b><br><small>${esc(S.u.name)} · ${ROLES[S.u.role]}${db.school.year?' · '+esc(db.school.year):''}</small></div></div><button class="b a" onclick="logout()">Quitter</button></header>
 <nav>${tabs.map(t=>`<button class="${t==S.tab?'on':''}" onclick="S.tab='${t}';render()">${LBL[t]}</button>`).join('')}</nav><main>${V[S.tab]()}</main>`}

const V={
home(){const n=db.grades.length;return `<div class="card"><h2>Tableau de bord</h2><div class="kpi"><div><b>${db.students.length}</b>Élèves</div><div><b>${db.classes.length}</b>Classes</div><div><b>${db.subjects.length}</b>Affectations</div><div><b>${n}</b>Notes saisies</div></div></div>
 <div class="card"><h2>Moyennes par classe (année)</h2><table><tr><th>Classe</th><th>Effectif</th><th>Moyenne</th></tr>${db.classes.map(c=>{const st=db.students.filter(s=>s.cls==c.id);return `<tr><td>${esc(c.name)}</td><td>${st.length}</td><td><b>${f(mean(st.map(s=>gen(s.id,c.id,0)).filter(x=>x!=null)))}</b></td></tr>`}).join('')}</table></div>`},
config(){const s=db.school,F=(id,l,k,ty)=>`<label>${l}<input id="${id}" ${ty?`type="${ty}"`:''} value="${esc(s[k]||'')}"></label>`;
 return `<div class="card"><h2>Informations de l'établissement</h2><div class="g">${F('sn',"Nom de l'établissement",'name')}${F('sy','Année scolaire (ex : 2026/2027)','year')}${F('sh','Responsable / Directeur','head')}${F('sp','Téléphone','phone','tel')}${F('se','Email','email','email')}${F('sa','Adresse','address')}${F('ss','Slogan','slogan')}<label>Logo<input type="file" accept="image/*" onchange="logoUp(this)"></label></div><p><img id="lp" src="${s.logo||''}" height="64" style="${s.logo?'':'display:none'}"></p><button class="b" onclick="saveConfig()">Enregistrer</button></div>`},
profs(){const P=db.users.filter(u=>u.role=='prof'),dl=[...new Set(Object.values(TPL).flat().map(x=>x[0]))];
 return `<div class="card"><h2>Nouvel enseignant</h2>${db.classes.length?'':`<p class="red">Créez d'abord des classes (onglet Classes) pour pouvoir affecter l'enseignant.</p>`}<div class="g"><label>Nom<input id="pn"></label><label>Discipline<input id="pd" list="dl"></label><label>Téléphone<input id="pt" type="tel"></label><label>Email (identifiant)<input id="pe" type="email" autocapitalize="none"></label><label>Mot de passe (6+)<input id="pp" type="password"></label></div><datalist id="dl">${dl.map(d=>`<option value="${esc(d)}">`).join('')}</datalist><p class="ck"><b>Classes :</b> ${db.classes.map(c=>`<label><input type="checkbox" class="nk" value="${c.id}"> ${esc(c.name)}</label>`).join('')||'—'}</p><button class="b" onclick="addProf()">Créer le compte</button></div>
 <div class="card"><h2>Enseignants (${P.length})</h2><div class="sc"><table><tr><th>Nom</th><th>Discipline</th><th>Contact</th><th>Classes affectées</th><th></th></tr>${P.map(p=>`<tr><td>${esc(p.name)}</td><td><input value="${esc(p.discipline||'')}" list="dl" onchange="setProf('${p.id}',this.value)"></td><td>${esc(p.login)}<br>${esc(p.phone||'')}</td><td class="ck">${db.classes.map(c=>`<label><input type="checkbox" ${db.subjects.some(s=>s.teacher==p.id&&s.cls==c.id)?'checked':''} onchange="toggleCls('${p.id}','${c.id}',this.checked)"> ${esc(c.name)}</label>`).join('')||'—'}</td><td><button class="d" onclick="del('profiles','${p.id}')">Retirer</button></td></tr>`).join('')}</table></div></div>`},
classes(){const P=db.users.filter(u=>u.role=='prof');
 return `<div class="card"><h2>Nouvelle classe</h2><div class="row"><select onchange="S.cy=this.value;render()">${Object.keys(LEVELS).map(c=>`<option ${c==S.cy?'selected':''}>${c}</option>`).join('')}</select><select id="cl">${LEVELS[S.cy].map(l=>`<option>${l}</option>`).join('')}</select><input id="cs" class="num" placeholder="Section"><input id="cc" class="num" type="number" placeholder="Eff. max"><select id="ct"><option value="">Titulaire…</option>${opt(P)}</select></div><label><input type="checkbox" id="cx" checked> Créer les matières standard du cycle ${S.cy}</label> <button class="b" onclick="addClass()">Créer la classe</button></div>
 <div class="card"><h2>Classes (${db.classes.length})</h2><div class="sc"><table><tr><th>Classe</th><th>Cycle</th><th>Effectif</th><th>Titulaire</th><th>Matières</th><th></th></tr>${db.classes.map(c=>{const n=db.students.filter(s=>s.cls==c.id).length;return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.cycle||'')}</td><td>${n}${c.capacity?' / '+c.capacity:''}</td><td><select onchange="setCls('${c.id}',this.value)"><option value="">—</option>${opt(P,c.head_teacher)}</select></td><td>${db.subjects.filter(s=>s.cls==c.id).length}</td><td><button class="d" onclick="del('classes','${c.id}')">Suppr.</button></td></tr>`}).join('')}</table></div></div>`},
eleves(){const L=db.students.filter(s=>!S.fc||s.cls==S.fc);
 return `<div class="card"><h2>Élèves</h2>${db.classes.length?`<div class="row"><input id="ne" placeholder="Nom complet"><select id="nk">${opt(db.classes,S.fc)}</select><button class="b" onclick="add('students',{name:$('ne').value,cls:$('nk').value})">Ajouter</button></div>`:'<p class="red">Créez d\'abord une classe.</p>'}<div class="row"><select onchange="S.fc=this.value;render()"><option value="">Toutes les classes</option>${opt(db.classes,S.fc)}</select><span>${L.length} élève(s)</span></div><div class="sc"><table><tr><th>Nom</th><th>Classe</th><th></th></tr>${L.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(nm('classes',s.cls))}</td><td><button class="d" onclick="del('students','${s.id}')">Suppr.</button></td></tr>`).join('')}</table></div></div>`},
matieres(){const T=db.users.filter(u=>u.role=='prof'),to=v=>`<option value="">— non affectée —</option>${opt(T,v)}`;
 return `<div class="card"><h2>Matières par classe</h2><div class="row"><input id="mn" placeholder="Matière"><input id="mc" class="num" type="number" value="1" min="0.5" step="0.5"><select id="mk">${opt(db.classes)}</select><select id="mt">${to()}</select><button class="b" onclick="add('subjects',{name:$('mn').value,coef:+$('mc').value||1,cls:$('mk').value,teacher:$('mt').value||null})">Ajouter</button></div><div class="sc"><table><tr><th>Matière</th><th>Classe</th><th>Coef</th><th>Enseignant</th><th></th></tr>${[...db.subjects].sort((a,b)=>nm('classes',a.cls).localeCompare(nm('classes',b.cls))).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(nm('classes',s.cls))}</td><td><input class="num" type="number" step="0.5" min="0.5" value="${s.coef}" onchange="setSub('${s.id}','coef',this.value)"></td><td><select onchange="setSub('${s.id}','teacher',this.value)">${to(s.teacher)}</select></td><td><button class="d" onclick="del('subjects','${s.id}')">Suppr.</button></td></tr>`).join('')}</table></div></div>`},
notes(){const A=myAs();if(!A.length)return '<div class="card">Aucune matière ne vous est affectée.</div>';if(!A.find(a=>a.id==S.as))S.as=A[0].id;const a=A.find(x=>x.id==S.as),st=db.students.filter(s=>s.cls==a.cls);
 const titles=[...new Set(db.grades.filter(g=>g.sub==a.id&&g.tri==S.tri).map(g=>g.t))];
 return `<div class="card"><h2>Saisie des notes</h2><div class="row"><select onchange="S.as=this.value;render()">${opt(A,S.as,x=>x.name+' – '+nm('classes',x.cls))}</select><select onchange="S.tri=this.value;render()">${[1,2,3].map(t=>`<option value="${t}" ${t==S.tri?'selected':''}>Trimestre ${t}</option>`).join('')}</select><input id="tt" list="tl" placeholder="Intitulé (ex : DS 1)" value="${esc(S.title)}" onchange="S.title=this.value;render()"><datalist id="tl">${titles.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
 ${S.title?`<div class="sc"><table><tr><th>Élève</th><th>Note /20</th></tr>${st.map(s=>{const g=db.grades.find(g=>g.sub==a.id&&g.stu==s.id&&g.tri==S.tri&&g.t==S.title);return `<tr><td>${esc(s.name)}</td><td><input class="num" type="number" min="0" max="20" step="0.25" data-s="${s.id}" value="${g?g.v:''}"></td></tr>`}).join('')}</table></div><p><button class="b" onclick="saveGr()">Enregistrer</button></p>`:'<p style="color:var(--m)">Saisissez un intitulé de devoir pour afficher la liste.</p>'}</div>
 <div class="card"><h2>Moyennes T${S.tri}</h2><table><tr><th>Élève</th><th>Moyenne</th></tr>${st.map(s=>`<tr><td>${esc(s.name)}</td><td>${f(avgSub(s.id,a.id,S.tri))}</td></tr>`).join('')}</table></div>`},
bulletins(){if(!db.classes.find(c=>c.id==S.cls))S.cls=(db.classes[0]||{}).id;const st=db.students.filter(s=>s.cls==S.cls);if(!st.find(s=>s.id==S.stu))S.stu=(st[0]||{}).id;const s=st.find(x=>x.id==S.stu),T=S.tri;
 let h=`<div class="card noprint"><h2>Bulletins scolaires</h2><div class="row"><select onchange="S.cls=this.value;render()">${opt(db.classes,S.cls)}</select><select onchange="S.stu=this.value;render()">${opt(st,S.stu)}</select><select onchange="S.tri=this.value;render()">${[1,2,3,0].map(t=>`<option value="${t}" ${t==T?'selected':''}>${t?'Trimestre '+t:'Annuel'}</option>`).join('')}</select><button class="b a" onclick="window.print()">🖨️ Imprimer / PDF</button></div></div>`;
 if(!s)return h;const m=gen(s.id,S.cls,T);
 return h+`<div class="card bul"><div class="hd"><div style="display:flex;gap:10px;align-items:center">${db.school.logo?`<img src="${db.school.logo}" height="56">`:''}<div><h1>${esc(db.school.name||'Établissement')}</h1><small>${esc(db.school.slogan||'')}<br>${esc(db.school.address||'')}${db.school.phone?' · Tél '+esc(db.school.phone):''}</small></div></div><div style="text-align:right"><b>Bulletin ${T?'du trimestre '+T:'annuel'}</b> · ${esc(db.school.year||'')}<br><b>${esc(s.name)}</b><br>${esc(nm('classes',S.cls))}</div></div>
 <div class="sc"><table><tr><th>Matière</th><th>Coef</th><th>Élève</th><th>Classe</th><th>Enseignant</th></tr>${db.subjects.filter(x=>x.cls==S.cls).map(x=>{const cm=mean(st.map(y=>avgSub(y.id,x.id,T)).filter(v=>v!=null));return `<tr><td>${esc(x.name)}</td><td>${x.coef}</td><td><b class="${avgSub(s.id,x.id,T)<10&&avgSub(s.id,x.id,T)!=null?'red':''}">${f(avgSub(s.id,x.id,T))}</b></td><td>${f(cm)}</td><td>${esc(nm('users',x.teacher))}</td></tr>`}).join('')}</table></div>
 <p style="font-size:18px">Moyenne générale : <b>${f(m)}/20</b> · Rang : <b>${rank(s.id,S.cls,T)||'–'}</b></p><p><b>Appréciation :</b> ${appr(m)}</p><p style="margin-top:40px;display:flex;justify-content:space-between"><span>Titulaire : ${esc(nm('users',(db.classes.find(c=>c.id==S.cls)||{}).head_teacher))}</span><span>${esc(db.school.head||'La Direction')}<br><small>Le Responsable</small></span></p></div>`}
,
users(){const U=db.users.filter(u=>u.role!='prof');return `<div class="card"><h2>Comptes administration</h2><div class="row"><input id="un" placeholder="Nom"><input id="ul" type="email" placeholder="Email" autocapitalize="none"><input id="up" type="password" placeholder="Mot de passe (6+)"><select id="ur"><option value="direction">Administration</option><option value="admin">Administrateur</option></select><button class="b" onclick="addUser()">Créer</button></div><div class="sc"><table><tr><th>Nom</th><th>Email</th><th>Rôle</th><th></th></tr>${U.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.login)}</td><td><select onchange="setRole('${u.id}',this.value)" ${u.id==S.u.id?'disabled':''}>${Object.entries({...ROLES,pending:'En attente'}).map(([k,v])=>`<option value="${k}" ${k==u.role?'selected':''}>${v}</option>`).join('')}</select></td><td>${u.id==S.u.id?'':`<button class="d" onclick="del('profiles','${u.id}')">Retirer</button>`}</td></tr>`).join('')}</table></div></div>`}
};
const err=e=>{if(e){alert(e.message||e);return true}};
async function fetchAll(t){let a=[],i=0;for(;;){const{data,error}=await sb.from(t).select('*').range(i,i+999);if(error)throw error;a=a.concat(data);if(data.length<1000)return a;i+=1000}}
async function loadAll(){const[u,c,s,m,g,sc]=await Promise.all(['profiles','classes','students','subjects','grades','schools'].map(fetchAll));db={users:u,classes:c,students:s,subjects:m,grades:g,school:sc[0]||{}};document.title=db.school.name||'Scolaria'}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('lg').value.trim(),password:$('pw').value});if(error)return $('er').textContent='Identifiants incorrects';enter()}
async function enter(){const{data:{user}}=await sb.auth.getUser();const{data:p}=user?await sb.from('profiles').select('*').eq('id',user.id).maybeSingle():{};
 if(!p||!TABS[p.role]){await sb.auth.signOut();S.u=null;render();const e=$('er');if(e)e.textContent="Compte non activé : contactez l'administrateur.";return}
 S.u=p;try{await loadAll()}catch(e){err(e)}S.tab=TABS[p.role][0];render()}
async function logout(){await sb.auth.signOut();S.u=null;render()}
async function add(l,o){if(!o.name)return;const{data,error}=await sb.from(l).insert(o).select().single();if(err(error))return;db[l].push(data);render()}
async function del(l,id){if(!confirm('Supprimer ?'))return;if(err((await sb.from(l).delete().eq('id',id)).error))return;await loadAll();render()}
async function setRole(id,role){if(err((await sb.from('profiles').update({role}).eq('id',id)).error))return;await loadAll();render()}
async function mkUser(email,password,name,role,phone,disc){const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 const{data,error}=await tmp.auth.signUp({email,password,options:{data:{name}}});if(err(error))return;
 if(err((await sb.rpc('adopt_user',{uid:data.user.id,urole:role,uname:name,uphone:phone||null,udisc:disc||null})).error))return;return data.user.id}
async function addUser(){const e=$('ul').value.trim(),p=$('up').value,n=$('un').value.trim()||e;if(!e||p.length<6)return alert('Email et mot de passe (6 caractères min.) requis');if(await mkUser(e,p,n,$('ur').value)){await loadAll();render()}}
async function register(){const e=$('lg').value.trim(),p=$('pw').value,s=$('rs').value.trim(),h=$('rh').value.trim(),m=$('er');if(!s||!e||p.length<6)return m.textContent="Nom de l'établissement, email et mot de passe (6+) requis";
 const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:h||e}}});if(error)return m.textContent=error.message;
 if(!data.session)return m.textContent="Confirmation d'email activée dans Supabase : désactivez-la (voir README).";
 const r=await sb.rpc('register_school',{sname:s,head:h});if(r.error)return m.textContent=r.error.message;S.reg=false;enter()}
async function assign(p,c,on){if(on){const f=db.subjects.find(s=>s.cls==c&&!s.teacher&&s.name==p.discipline);return f?(await sb.from('subjects').update({teacher:p.id}).eq('id',f.id)).error:(await sb.from('subjects').insert({name:p.discipline,coef:1,cls:c,teacher:p.id})).error}
 return (await sb.from('subjects').update({teacher:null}).match({teacher:p.id,cls:c})).error}
async function toggleCls(t,c,on){const p=db.users.find(u=>u.id==t);if(on&&!p.discipline){alert("Renseignez d'abord la discipline de l'enseignant");return render()}err(await assign(p,c,on));await loadAll();render()}
async function addProf(){const email=$('pe').value.trim(),password=$('pp').value,name=$('pn').value.trim(),dis=$('pd').value.trim();if(!email||!name||password.length<6)return alert('Nom, email et mot de passe (6 caractères min.) requis');
 const id=await mkUser(email,password,name,'prof',$('pt').value,dis);if(!id)return;await loadAll();const p=db.users.find(u=>u.id==id);
 if(p&&dis)for(const c of [...document.querySelectorAll('.nk:checked')].map(x=>x.value))err(await assign(p,c,true));await loadAll();render()}
async function setProf(id,v){err((await sb.from('profiles').update({discipline:v.trim()||null}).eq('id',id)).error);await loadAll();render()}
async function setSub(id,k,v){err((await sb.from('subjects').update({[k]:k=='coef'?(+v||1):(v||null)}).eq('id',id)).error);await loadAll();render()}
async function setCls(id,v){err((await sb.from('classes').update({head_teacher:v||null}).eq('id',id)).error);await loadAll();render()}
async function addClass(){const lv=$('cl').value,sec=$('cs').value.trim();const{data,error}=await sb.from('classes').insert({name:lv+(sec?' '+sec:''),level:lv,cycle:S.cy,section:sec,capacity:+$('cc').value||null,head_teacher:$('ct').value||null}).select().single();if(err(error))return;
 if($('cx').checked)err((await sb.from('subjects').insert(TPL[S.cy].map(([name,coef])=>({name,coef,cls:data.id})))).error);await loadAll();render()}
async function saveConfig(){const o={name:$('sn').value.trim(),year:$('sy').value.trim(),head:$('sh').value.trim(),phone:$('sp').value.trim(),email:$('se').value.trim(),address:$('sa').value.trim(),slogan:$('ss').value.trim()};if(!o.name)return alert("Le nom de l'établissement est obligatoire");if(S.logo!==undefined)o.logo=S.logo;
 if(err((await sb.from('schools').update(o).eq('id',db.school.id)).error))return;S.logo=undefined;await loadAll();alert('Configuration enregistrée ✔');render()}
function logoUp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');$('lp').src=S.logo;$('lp').style.display=''};im.src=r.result};r.readAsDataURL(f)}
async function saveGr(){const rows=[],gone=[];document.querySelectorAll('input[data-s]').forEach(i=>{const k={sub:S.as,stu:i.dataset.s,tri:+S.tri,t:S.title};i.value===''?gone.push(k):rows.push({...k,v:Math.min(20,Math.max(0,+i.value))})});
 if(rows.length&&err((await sb.from('grades').upsert(rows,{onConflict:'sub,stu,tri,t'})).error))return;
 for(const k of gone)await sb.from('grades').delete().match(k);
 db.grades=await fetchAll('grades');alert('Notes enregistrées ✔');render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{const{data:{session}}=await sb.auth.getSession();session?enter():render()})();
</script></body></html>
