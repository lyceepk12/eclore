 const fs=await Promise.all(Array.from({length:np},(_,i)=>mk(i==0).range(1000*i,1000*i+999)));let a=fs.flatMap(ok);const n=fs[0].count||0;

function mixc(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function applyTheme(){const r=document.documentElement.style,s=(S.u&&db.school)||{},hx=v=>/^#[0-9a-f]{6}$/i.test(v||'')?v:null,c=hx(s.color),a=hx(s.color2);['--p','--p2','--side','--side2','--h1','--h2','--a','--a2'].forEach(k=>r.removeProperty(k));
 const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!='light';
 if(c){r.setProperty('--h1',c);r.setProperty('--h2',mixc(c,'#ffffff',.14));r.setProperty('--side',mixc(c,'#000000',.45));r.setProperty('--side2',mixc(c,'#000000',.62));r.setProperty('--p',dark?mixc(c,'#ffffff',.45):c);r.setProperty('--p2',dark?mixc(c,'#ffffff',.6):mixc(c,'#ffffff',.14))}
 if(a){r.setProperty('--a',a);r.setProperty('--a2',mixc(a,'#ffffff',.78))}}
function prevTheme(){db.school.color=$('sc1').value;db.school.color2=$('sc2').value;applyTheme()}
function setPreset(a,b){$('sc1').value=a||'#1f2a56';$('sc2').value=b||'#c8963e';prevTheme()}
function gotoNotes(id){const s=db.subjects.find(x=>x.id==id),c=db.classes.find(x=>x.id==(s||{}).cls);if(!c)return;S.nv=c.level||'Autres';S.nc=c.id;S.ns=id;S.nt='';go('notes','Notes & résultats')}
function teacherHome(){const sc=db.school,fn=(S.u.name||'').split(' ')[0],mine=db.subjects.filter(s=>s.teacher==S.u.id).sort((a,b)=>nm('classes',a.cls).localeCompare(nm('classes',b.cls)));
 return `<div class="hero"><div class="hs">${esc(sc.slogan||BRAND.s)}</div><h1>Bonjour${fn?' '+esc(fn):''} 👋</h1><p>${esc(sc.name||'')}${db.year&&db.year.label?' · année scolaire '+esc(db.year.label):''}</p></div>
 <div class="card"><h2>Périodes de saisie</h2>${[1,2,3].map(n=>termBanner(n)).join('')}</div>
 <div class="card"><h2>Mes classes et matières</h2>${mine.length?`<div class="sc"><table><tr><th>Matière</th><th>Classe</th><th>Groupe</th><th></th></tr>${mine.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(nm('classes',s.cls))}</td><td>${esc(GL[s.grp||'all'])}</td><td><button class="b" onclick="gotoNotes('${s.id}')">Saisir les notes</button></td></tr>`).join('')}</table></div>`:'<p style="color:var(--m)">Aucune matière ne vous est encore affectée : contactez l\'administration.</p>'}</div>`}
const ph=s=>PH[s.id]||'';let PHP=0;
function needPh(L){const miss=L.filter(s=>s&&s.id&&!(s.id in PH));if(miss.length&&!PHP){PHP=1;(async()=>{try{const ch=[];for(let i=0;i<miss.length;i+=30)ch.push(miss.slice(i,i+30).map(s=>s.id));await Promise.all(ch.map(async ids=>{const{data}=await sb.from('students').select('id,photo').in('id',ids);ids.forEach(id=>PH[id]='');(data||[]).forEach(r=>PH[r.id]=r.photo||'')}))}catch(e){miss.forEach(s=>PH[s.id]='')}PHP=0;render()})()}return ''}
let XP=null;const loadXlsx=()=>window.XLSX?Promise.resolve():(XP=XP||new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>{XP=null;rej(new Error('Module Excel indisponible : vérifiez la connexion.'))};document.head.appendChild(s)}));
const permList=r=>{const p=db.perms.find(x=>x.role==r);return p?p.tabs:(DEF[r]||[])};
const canWrite=k=>S.u.role=='admin'||S.u.role=='super'||permList(S.u.role).includes(k),rd=()=>ro()||(S.tab!='home'&&!canWrite(PERMK[S.tab]||S.tab));
function lockUI(){const m=document.querySelector('main.ro');if(!m)return;m.querySelectorAll('input,select,textarea,button').forEach(e=>{if(e.closest('.v')||e.classList.contains('v'))return;if(e.tagName=='BUTTON')e.style.display='none';else e.disabled=true})}
async function savePerms(){const rows=['direction','adjoint','secretaire','surveillant','prof'].map(r=>({school_id:db.school.id,role:r,tabs:[...document.querySelectorAll('.pm[data-r="'+r+'"]')].filter(s=>s.value).map(s=>s.value=='r'?s.dataset.k+':r':s.dataset.k)}));
 if(err((await sb.from('role_perms').upsert(rows,{onConflict:'school_id,role'})).error))return;await loadAll();alert('Autorisations enregistrées ✔');render()}
const fdd=d=>d?d.split('-').reverse().join('-'):'';
function cardF(s){const sc=db.school,c=db.card||{},cl=db.classes.find(x=>x.id==s.cls)||{};
 return `<div class="cd"><div class="cdt" style="color:${c.color||db.school.color||'#1f2a56'}">${esc(c.front_title||'Carte scolaire')}</div>${sc.logo?`<img class="cdl" src="${sc.logo}">`:''}<div class="cdc"><b>${esc(sc.name||'')}</b><div><b>Matricule:</b> ${esc(s.matricule||'')}</div><div><b>Nom:</b> ${esc(s.name.toUpperCase())}</div><div><b>Date de naissance:</b> ${fdd(s.birth)}</div><div><b>Classe:</b> ${esc(cl.name||'')}</div><div><b>Année scolaire:</b> ${esc((db.year||{}).label||'')}</div><div><b>Tél d'établissement:</b> ${esc(sc.phone||'')}</div></div>${ph(s)?`<img class="cdp" src="${ph(s)}">`:'<div class="cdp">👤</div>'}${sc.signature?`<img class="cds" src="${sc.signature}">`:''}</div>`}
function cardB(){const sc=db.school,c=db.card||{},col=c.color||db.school.color||'#1f2a56',im=c.back_img||sc.logo;
 return `<div class="cd cdb" style="border-top:3mm solid ${col}">${im?`<img class="cbi" src="${im}">`:''}<div class="cbt">${esc(c.back_text||'')}</div><div class="cbf">${esc(sc.name||'')}${sc.address?' · '+esc(sc.address):''}${sc.phone?' · Tél '+esc(sc.phone):''}</div></div>`}
function cardSheets(L,mode){let h='';const E='<div class="cd empty"></div>';
 for(let i=0;i<L.length;i+=8){const p=L.slice(i,i+8);while(p.length<8)p.push(null);const sw=[];for(let r=0;r<8;r+=2)sw.push(p[r+1],p[r]);
  if(mode!='v')h+=`<div class="sheet">${p.map(s=>s?cardF(s):E).join('')}</div>`;
  if(mode!='f')h+=`<div class="sheet">${sw.map(s=>s?cardB():E).join('')}</div>`}
 return h}
async function saveCard(rm){const o={school_id:db.school.id,front_title:$('ft').value.trim()||null,color:$('fc').value,back_text:$('fb').value.trim()||null};if(rm)o.back_img=null;else if(S.cbi!==undefined)o.back_img=S.cbi;
 if(err((await sb.from('card_settings').upsert(o,{onConflict:'school_id'})).error))return;S.cbi=undefined;await loadAll();alert('Carte personnalisée ✔');render()}
const imgData=(f,max)=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)});
function stuPhoto(i,id){pickImg(i,160,'tmp','image/jpeg',async d=>{if(err((await sb.from('students').update({photo:d}).eq('id',id)).error))return;PH[id]=d;await loadAll();render()})}
async function impPhotos(i){const ok=[],ko=[];for(const f of [...i.files]){const mat=f.name.replace(/\.[^.]+$/,'').trim().toLowerCase(),s=db.students.find(x=>(x.matricule||'').toLowerCase()==mat);if(!s){ko.push(f.name);continue}const d=await imgData(f,160);if(!d){ko.push(f.name);continue}
  const e=(await sb.from('students').update({photo:d}).eq('id',s.id)).error;e?ko.push(f.name):(ok.push(f.name),PH[s.id]=d)}
 i.value='';await loadAll();render();alert(ok.length+' photo(s) importée(s).'+(ko.length?'\nNon associées (matricule introuvable) :\n'+ko.join('\n'):''))}
async function resetPerms(){if(!confirm('Rétablir les autorisations par défaut ?'))return;if(err((await sb.from('role_perms').delete().eq('school_id',db.school.id)).error))return;await loadAll();render()}
async function saveGr(){if(!canEdit(+S.tri))return alert("Saisie clôturée pour ce trimestre : demandez une prolongation à l'administration.");const rows=[],gone=[];document.querySelectorAll('input[data-s]').forEach(i=>{const k={sub:S.as,stu:i.dataset.s,tri:+S.tri,t:S.title};i.value===''?gone.push(k):rows.push({...k,v:Math.min(20,Math.max(0,+i.value))})});
 if(rows.length&&err((await sb.from('grades').upsert(rows,{onConflict:'sub,stu,tri,t'})).error))return;
 for(const k of gone)await sb.from('grades').delete().match(k);
 db.grades=await fetchAll('grades');alert('Notes enregistrées ✔');render()}
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('Nouvelle version installée : rechargez la page pour en profiter.')})}
(async()=>{const{data:{session}}=await sb.auth.getSession();session?enter():render()})();
</script></body></html>
