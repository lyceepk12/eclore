.side nav{display:flex;flex-direction:column;gap:2px;padding:10px;background:none;border:0;overflow:visible;flex:1}.side nav button{text-align:left;color:#d6efec;padding:10px 12px}.side nav button.on{background:rgba(255,255,255,.2);color:#fff}
.me{padding:12px 14px;border-top:1px solid rgba(255,255,255,.2);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}.top,.ov{display:none}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:20;transform:translateX(-100%);transition:transform .2s}.shell.open .side{transform:none}.top{display:flex;align-items:center;gap:10px;background:var(--p);color:#fff;padding:10px 14px}.shell.open .ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}}

const opt=(l,sel,fn)=>l.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(fn?fn(x):x.name)}</option>`).join('');

function render(){
 if(!S.u){$('app').innerHTML=`<div class="card login"><div style="font-size:44px">🎓</div><h2>Scolaria</h2><p style="color:var(--m)">Notes, carnets & bulletins</p><input id="lg" type="email" placeholder="Email" autocapitalize="none"><input id="pw" type="password" placeholder="Mot de passe"><button class="b" style="width:100%" onclick="login()">Se connecter</button><p id="er" class="red"></p><small style="color:var(--m)">Votre espace est créé par l'administrateur de la plateforme.</small></div>`;return}

const V={
home(){const n=db.grades.length;return `<div class="card"><h2>Tableau de bord</h2><div class="kpi"><div><b>${db.students.length}</b>Élèves</div><div><b>${db.classes.length}</b>Classes</div><div><b>${db.subjects.length}</b>Affectations</div><div><b>${n}</b>Notes saisies</div></div></div>
 <div class="card"><h2>Moyennes par classe (année)</h2><table><tr><th>Classe</th><th>Effectif</th><th>Moyenne</th></tr>${db.classes.map(c=>{const st=db.students.filter(s=>s.cls==c.id);return `<tr><td>${esc(c.name)}</td><td>${st.length}</td><td><b>${f(mean(st.map(s=>gen(s.id,c.id,0)).filter(x=>x!=null)))}</b></td></tr>`}).join('')}</table></div>`},
config(){const s=db.school,F=(id,l,k,ty)=>`<label>${l}<input id="${id}" ${ty?`type="${ty}"`:''} value="${esc(s[k]||'')}"></label>`,IM=(l,key,v)=>`<label>${l}<input type="file" accept="image/*" onchange="pickImg(this,${key=='logo'?256:360},'${key}','image/png')"></label><p><img id="pv_${key}" src="${v||''}" height="64" style="${v?'':'display:none;'}background:#fff;border:1px solid var(--b)"></p>`;
 return `<div class="card"><h2>Informations de l'établissement</h2><div class="g">${F('sn',"Nom de l'établissement",'name')}${F('sh','Responsable','head')}${F('st','Fonction du responsable (ex : Proviseur(e))','head_title')}${F('sp','Téléphone','phone','tel')}${F('se','Email','email','email')}${F('sa','Adresse','address')}${F('ss','Slogan','slogan')}</div><div class="g"><div>${IM('Logo','logo',s.logo)}</div><div>${IM('Signature du responsable (PNG, fond blanc ou transparent)','sig',s.signature)}</div></div><button class="b" onclick="saveConfig()">Enregistrer</button></div>`},
profs(){const P=db.users.filter(u=>u.role=='prof'),e=db.users.find(u=>u.id==S.ep)||{},tp=P.find(p=>p.id==S.at)||P[0]||{},ds=(tp.disciplines&&tp.disciplines.length)?tp.disciplines:db.disciplines.map(d=>d.name);
 return `<div class="card"><h2>${e.id?"Modifier l'enseignant":'Nouvel enseignant'}</h2>${db.disciplines.length?'':`<p class="red">Ajoutez d'abord les matières dans l'onglet Matières.</p>`}<div class="g"><label>Nom<input id="pn" value="${esc(e.name||'')}"></label><label>Téléphone<input id="pt" type="tel" value="${esc(e.phone||'')}"></label><label>Email (identifiant)<input id="pe" type="email" autocapitalize="none" value="${esc(e.login||'')}" ${e.id?'disabled':''}></label><label>${e.id?'Nouveau mot de passe (vide = inchangé)':'Mot de passe (6+)'}<input id="pp" type="password"></label></div><p class="ck"><b>Disciplines enseignées :</b> ${db.disciplines.map(d=>`<label><input type="checkbox" class="pdk" value="${esc(d.name)}" ${(e.disciplines||[]).includes(d.name)?'checked':''}> ${esc(d.name)}</label>`).join('')||'—'}</p><button class="b" onclick="saveProf()">${e.id?'Enregistrer':'Créer le compte'}</button>${e.id?` <button class="d" style="color:var(--m)" onclick="S.ep='';render()">Annuler</button>`:''}</div>
 <div class="card"><h2>Importer des enseignants (Excel)</h2><p style="color:var(--m)">Colonnes : Nom, Email, Mot de passe, Téléphone, Disciplines (séparées par une virgule). Un mot de passe est généré si la colonne est vide.</p><div class="row"><input type="file" accept=".xlsx,.xls,.csv" onchange="impProf(this)"><button class="d" style="color:var(--p)" onclick="tplXlsx('prof')">⬇ Modèle</button></div></div>

const ord=r=>r==1?'1er':r+'ème',fd=d=>d?d.split('-').reverse().join('/'):'';
const aprS=m=>m==null?'':m>=16?'Excellent !':m>=14?'Très bien':m>=12?'Bien':m>=10?"Moyen, doit fournir plus d'effort":m>=8?'Travail insuffisant, des efforts sont attendus !':m>=3?'Faible, doit progresser davantage':'Abandon';
const aprG=m=>m==null?'':m>=16?'Excellents résultats, félicitations':m>=14?'Très bons résultats, continuez ainsi':m>=12?'Bons résultats':m>=10?'Résultats satisfaisants, doit poursuivre ses efforts':"Résultats insuffisants, doit fournir plus d'effort";
function bul(s){const T=+S.tri,sc=db.school,c=db.classes.find(x=>x.id==s.cls)||{},cs=db.students.filter(x=>x.cls==s.cls),m=gen(s.id,s.cls,T),b=(T&&db.binfo.find(x=>x.stu==s.id&&x.tri==T))||{},r=rank(s.id,s.cls,T),
 sa=db.subjects.filter(x=>x.cls==s.cls&&(!x.grp||x.grp=='all'||x.grp==s.sex)).map(x=>{const a=avgSub(s.id,x.id,T),L=cs.map(y=>{const z=db.subjects.find(z=>z.cls==y.cls&&z.name==x.name&&(!z.grp||z.grp=='all'||z.grp==y.sex));return z?avgSub(y.id,z.id,T):null}).filter(v=>v!=null).sort((p,q)=>q-p);return `<tr><td class="n">${esc(x.name)}</td><td class="t">${esc(nm('users',x.teacher))}</td><td class="c">${db.grades.filter(g=>g.stu==s.id&&g.sub==x.id&&(!T||g.tri==T)).length}</td><td class="c">${a==null?'–':L.indexOf(a)+1}</td><td class="c">${f(a)}</td><td class="c">${f(mean(L))}</td><td class="t">${aprS(a)}</td></tr>`}).join('');
 return `<div class="bul"><div class="bh"><div class="b1">${sc.logo?`<img src="${sc.logo}">`:''}<div><div class="sn">${esc(sc.name||'')}</div><div><b>Téléphone:</b> ${esc(sc.phone||'')}</div><div><b>E-mail:</b> ${esc(sc.email||'')}</div><div><b>Année scolaire:</b> ${esc((db.year||{}).label||sc.year||'')}</div></div></div><div><div class="bt1">Bulletin ${T?'du Trimestre '+T:'Annuel'}</div><div>${esc(s.matricule||'')}</div><div><b>${esc(s.name.toUpperCase())}</b></div><div><b>Né (e) :</b> ${fd(s.birth)}</div><div><b>${esc(c.name||'')}</b> (${cs.length})</div><div><b>Professeur Principal:</b> ${esc(nm('users',c.head_teacher))}</div></div><div class="b3"><div><b>Le :</b> ${new Date().toLocaleDateString('fr-FR').replace(/\//g,'-')}</div>${s.photo?`<img src="${s.photo}">`:''}</div></div>
<table><tr><th rowspan="2">matière</th><th rowspan="2">Enseignant</th><th rowspan="2">NB Note</th><th rowspan="2">Rang</th><th colspan="2">Moyennes</th><th rowspan="2">Appréciation</th></tr><tr><th>Élève</th><th>Classe</th></tr>${sa}<tr><td colspan="3" style="text-align:center">Moyenne Générale</td><td class="c">${r?ord(+r.split('/')[0]):'–'}</td><td class="c">${f(m)}</td><td class="c">${f(mean(cs.map(y=>gen(y.id,s.cls,T)).filter(v=>v!=null)))}</td><td></td></tr></table>
<div class="bf"><div class="bf1"><div class="bfh">APPRECIATION DU CONSEIL DE CLASSE</div><div class="bfr"><span>Absences</span><span>${esc(absTxt(s.id,T))}</span></div><div class="bfr"><span>Appréciation globale</span><span>${esc(b.appreciation||aprG(m))}</span></div><div class="bfr"><span>Absences & Conduite</span><span>${esc(b.conduite||'')}</span></div></div><div><div class="bfh">SIGNATURE & CACHET</div><div class="sg">${sc.signature?`<img src="${sc.signature}">`:''}<div>${esc(sc.head_title||'Le Responsable')}</div><small>${esc(sc.head||'')}</small></div></div></div></div>`}
const etat=s=>!s.active?'Suspendu':(s.paid_until&&s.paid_until<new Date().toISOString().slice(0,10))?'Expiré':'Actif';
async function saveProf(){const name=$('pn').value.trim(),ph=$('pt').value.trim()||null,ds=[...document.querySelectorAll('.pdk:checked')].map(x=>x.value),pw=$('pp').value;
 if(S.ep){if(!name)return;if(pw&&pw.length<6)return alert('Mot de passe : 6 caractères min.');if(err((await sb.from('profiles').update({name,phone:ph,disciplines:ds}).eq('id',S.ep)).error))return;if(pw&&err((await sb.rpc('set_password',{uid:S.ep,pw})).error))return;S.ep=''}
 else{const email=$('pe').value.trim();if(!email||!name||pw.length<6)return alert('Nom, email et mot de passe (6 caractères min.) requis');if(!await mkUser(email,pw,name,'prof',ph,ds))return}
 await loadAll();render()}
async function affect(){const tc=$('at').value,n=$('am').value,c=$('ac').value,g=$('ag').value;if(!tc||!n||!c)return alert('Choisissez enseignant, matière et classe');
 const ex=db.subjects.find(s=>s.cls==c&&s.name==n&&(s.grp||'all')==g);if(ex&&ex.teacher&&ex.teacher!=tc&&!confirm('Cette matière a déjà un enseignant pour ce groupe. Le remplacer ?'))return;
 const cl=db.classes.find(x=>x.id==c),cf=((TPL[cl.cycle]||[]).find(x=>x[0]==n)||[0,1])[1];
 const r=ex?await sb.from('subjects').update({teacher:tc}).eq('id',ex.id):await sb.from('subjects').insert({name:n,coef:cf,cls:c,teacher:tc,grp:g});if(err(r.error))return;await loadAll();render()}

async function resetPw(uid){const pw=prompt('Nouveau mot de passe (6 caractères min.)');if(!pw)return;if(err((await sb.rpc('set_password',{uid,pw})).error))return;alert('Mot de passe modifié ✔')}
async function enterSchool(id){if(err((await sb.rpc('sa_enter',{sid:id})).error))return;S.u.acting_school=id;S.vy=null;await loadAll();S.tab='home';render()}
async function leaveSchool(){if(err((await sb.rpc('sa_enter',{sid:null})).error))return;S.u.acting_school=null;S.vy=null;await loadAll();S.tab='schools';render()}
async function setPaid(id,v){err((await sb.from('schools').update({paid_until:v||null}).eq('id',id)).error);await loadAll();render()}
const nk=k=>String(k).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,''),splitD=v=>String(v).split(/[,;\/]/).map(x=>x.trim()).filter(Boolean);
function rowGet(r,...ks){for(const k of Object.keys(r)){const n=nk(k);if(ks.some(x=>n.startsWith(x)))return r[k]}return ''}
function toISO(v){if(v instanceof Date)return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);v=String(v).trim();if(!v)return null;const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:null}
function readXlsx(f,cb){const r=new FileReader();r.onload=()=>{const wb=XLSX.read(r.result,{type:'array',cellDates:true});cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))};r.readAsArrayBuffer(f)}
function tplXlsx(k){const rows=k=='stu'?[{'Nom':'Amina Said','Matricule':'1221925533','Date de naissance':'27/09/2008','Sexe':'F','Classe':(db.classes[0]||{}).name||'6ème A'}]:[{'Nom':'M. Diallo','Email':'diallo@ecole.com','Mot de passe':'Motdepasse1','Téléphone':'77000000','Disciplines':'Mathématiques, Physique-Chimie'}],wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Feuil1');XLSX.writeFile(wb,k=='stu'?'modele_eleves.xlsx':'modele_enseignants.xlsx')}
function impStu(i){const f=i.files[0];if(!f)return;readXlsx(f,async rows=>{const dc=$('ik').value,out=[],bad=[];
 rows.forEach(r=>{const name=String(rowGet(r,'nom','eleve','name')).trim();if(!name)return;const cn=String(rowGet(r,'classe')).trim().toLowerCase(),cl=cn?db.classes.find(c=>c.name.toLowerCase()==cn):db.classes.find(c=>c.id==dc);if(!cl)return bad.push(name+' (classe "'+cn+'" inconnue)');
  const sx=String(rowGet(r,'sexe','genre')).trim().toLowerCase()[0];out.push({name,matricule:String(rowGet(r,'matricule')).trim()||null,birth:toISO(rowGet(r,'datedenaissance','naissance','ne')),sex:sx=='f'?'F':(sx=='m'||sx=='g')?'M':null,cls:cl.id})});
 if(out.length&&err((await sb.from('students').insert(out)).error))return;i.value='';await loadAll();render();alert(out.length+' élève(s) importé(s).'+(bad.length?'\nIgnorés :\n'+bad.join('\n'):''))})}
function impProf(i){const f=i.files[0];if(!f)return;readXlsx(f,async rows=>{const ok=[],ko=[];S.q=true;
 const nw=[...new Set(rows.flatMap(r=>splitD(rowGet(r,'disciplines','matiere'))))].filter(n=>!db.disciplines.some(d=>d.name.toLowerCase()==n.toLowerCase()));
 if(nw.length){const e=(await sb.from('disciplines').insert(nw.map(name=>({name})))).error;if(e){S.q=false;return err(e)}}await loadAll();
 for(const r of rows){const name=String(rowGet(r,'nom','enseignant')).trim(),email=String(rowGet(r,'email','mail')).trim();if(!name||!email)continue;const pw=String(rowGet(r,'motdepasse','mdp')).trim()||Math.random().toString(36).slice(2,10)+'A1';
  if(pw.length<6){ko.push(email+' (mot de passe trop court)');continue}
  const ds=splitD(rowGet(r,'disciplines','matiere')).map(n=>(db.disciplines.find(d=>d.name.toLowerCase()==n.toLowerCase())||{name:n}).name);
  (await mkUser(email,pw,name,'prof',String(rowGet(r,'telephone','tel')).trim()||null,ds))?ok.push(email+' / '+pw):ko.push(email)}
 S.q=false;i.value='';await loadAll();render();alert(ok.length+' enseignant(s) créé(s) :\n'+ok.join('\n')+(ko.length?'\n\nÉchecs : '+ko.join(', '):''))})}
async function setSub(id,k,v){err((await sb.from('subjects').update({[k]:k=='coef'?(+v||1):(v||null)}).eq('id',id)).error);await loadAll();render()}
async function setCls(id,v){err((await sb.from('classes').update({head_teacher:v||null}).eq('id',id)).error);await loadAll();render()}

 if($('cx').checked){const nw=TPL[S.cy].map(x=>x[0]).filter(n=>!db.disciplines.some(d=>d.name==n));if(nw.length)err((await sb.from('disciplines').insert(nw.map(name=>({name})))).error);err((await sb.from('subjects').insert(TPL[S.cy].flatMap(([name,coef])=>name=='EPS'?[{name,coef,cls:data.id,grp:'F'},{name,coef,cls:data.id,grp:'M'}]:[{name,coef,cls:data.id}]))).error)}await loadAll();render()}
async function saveConfig(){const o={name:$('sn').value.trim(),head:$('sh').value.trim(),head_title:$('st').value.trim(),phone:$('sp').value.trim(),email:$('se').value.trim(),address:$('sa').value.trim(),slogan:$('ss').value.trim()};if(!o.name)return alert("Le nom de l'établissement est obligatoire");if(S.logo!==undefined)o.logo=S.logo;if(S.sig!==undefined)o.signature=S.sig;
 if(err((await sb.from('schools').update(o).eq('id',db.school.id)).error))return;S.logo=S.sig=undefined;await loadAll();alert('Configuration enregistrée ✔');render()}
function pickImg(i,max,key,type){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');if(type=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);S[key]=c.toDataURL(type,.85);const p=$('pv_'+key);if(p){p.src=S[key];p.style.display=''}};im.src=r.result};r.readAsDataURL(f)}
async function saveStu(){const o={name:$('ne').value.trim(),matricule:$('nm').value.trim()||null,birth:$('nb').value||null,cls:$('nk').value||null,sex:$('nx').value||null};if(!o.name)return;if(S.photo)o.photo=S.photo;
 const q=S.es?sb.from('students').update(o).eq('id',S.es):sb.from('students').insert(o);if(err((await q).error))return;S.es='';S.photo=undefined;await loadAll();render()}
async function saveBi(){const o={stu:S.stu,tri:+S.tri,absences:$('ba').value===''?null:+$('ba').value,appreciation:$('bg').value.trim()||null,conduite:$('bc').value.trim()||null};if(err((await sb.from('bulletin_info').upsert(o,{onConflict:'stu,tri'})).error))return;await loadAll();alert('Enregistré ✔');render()}
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),ro=()=>!!(db.year&&db.year.status&&db.year.status!='current');
const nextYear=l=>{const m=String(l||'').match(/^(\d{4})\s*([-\/])\s*(\d{4})$/);return m?(+m[1]+1)+m[2]+(+m[3]+1):''};
function termInfo(tri){const tm=db.terms.find(x=>x.tri==tri),td=today(),ex=db.ext.filter(e=>e.tri==tri&&e.until>=td&&(!e.teacher||e.teacher==S.u.id)).sort((a,b)=>b.until.localeCompare(a.until))[0],open=!tm||(!tm.locked&&(!tm.closes||tm.closes>=td));return{tm,ex,open,ok:open||!!ex}}
const canEdit=tri=>S.u.role!='prof'||termInfo(tri).ok;
function termBanner(tri){const i=termInfo(tri);let m,c='';
 if(i.open)m=i.tm&&i.tm.closes?"Saisie ouverte jusqu'au "+fd(i.tm.closes):'Saisie ouverte (aucune date de clôture)';
 else if(i.ex){m="Saisie clôturée, prolongée jusqu'au "+fd(i.ex.until)+(i.ex.reason?' ('+i.ex.reason+')':'')}
 else{m=i.tm.locked?"Saisie verrouillée par l'administration":"Saisie clôturée depuis le "+fd(i.tm.closes);c='red'}
 return `<p class="${c}"><b>Trimestre ${tri} :</b> ${esc(m)}${S.u.role!='prof'&&!i.ok?" — l'administration peut toujours saisir":''}</p>`}
async function saveTerms(){const rows=[1,2,3].map(n=>({year_id:db.year.id,tri:n,closes:$('tc'+n).value||null,locked:$('tl'+n).checked}));if(err((await sb.from('terms').upsert(rows,{onConflict:'year_id,tri'})).error))return;await loadAll();alert('Enregistré ✔');render()}
async function addExt(){const d=$('qd').value;if(!d)return alert('Choisissez la date limite');if(err((await sb.from('term_ext').insert({tri:+$('qt').value,teacher:$('qe').value||null,until:d,reason:$('qr').value.trim()||null})).error))return;await loadAll();render()}
async function newYear(){const l=$('ny').value.trim();if(!l)return alert("Indiquez l'année");if(!confirm("Archiver l'année en cours et démarrer "+l+" ? Cette action est définitive."))return;
 if(err((await sb.rpc('start_new_year',{ylabel:l,carry:$('nc').checked,with_students:$('ns').checked})).error))return;S.vy=null;await loadAll();S.tab='home';render();alert('Année '+l+' démarrée ✔')}
async function viewYear(id){S.vy=db.years.find(y=>y.id==id&&y.status=='current')?null:id;await loadAll();if(!ADMTABS.includes(S.tab)||ro()&&!['home','eleves','bulletins','years'].includes(S.tab))S.tab='home';render()}
const ORD=ORDER;
function tabsFor(){const r=S.u.role;let x;if(r=='super')x=S.u.acting_school?['schools',...ADMTABS]:['schools'];else if(r=='admin')x=ADMTABS;else{const p=db.perms.find(q=>q.role==r);x=(p?p.tabs:DEF[r]||[]).filter(k=>MATRIX.includes(k))}
 x=ORD.filter(k=>x.includes(k));return x.length?x:['home']}
function absTxt(id,T){const l=db.abs.filter(a=>a.stu==id&&(!T||a.tri==T));if(!l.length){const b=T&&db.binfo.find(x=>x.stu==id&&x.tri==T);return b&&b.absences!=null?b.absences+' heure (s)':''}
 const ab=l.filter(a=>a.kind=='absence'),h=ab.reduce((x,a)=>x+Number(a.hours),0),nj=ab.filter(a=>!a.justified).reduce((x,a)=>x+Number(a.hours),0),rt=l.filter(a=>a.kind=='retard').length;
 return h+' heure (s)'+(nj?' dont '+nj+' non justifiée(s)':'')+(rt?' · '+rt+' retard(s)':'')}
async function addAbs(){const o={stu:$('ae').value,tri:+S.atri||1,day:$('ad').value,kind:$('ak').value,hours:+$('ah').value||0,justified:$('aj').value=='1',reason:$('ar').value.trim()||null};if(!o.stu||!o.day)return alert('Choisissez un élève et une date');
 if(err((await sb.from('absences').insert(o)).error))return;S.ae=o.stu;S.ad=o.day;await loadAll();render()}

 if(err((await sb.from('role_perms').upsert(rows,{onConflict:'school_id,role'})).error))return;await loadAll();alert('Autorisations enregistrées ✔');render()}

async function saveGr(){if(!canEdit(+S.tri))return alert("Saisie clôturée pour ce trimestre : demandez une prolongation à l'administration.");const rows=[],gone=[];document.querySelectorAll('input[data-s]').forEach(i=>{const k={sub:S.as,stu:i.dataset.s,tri:+S.tri,t:S.title};i.value===''?gone.push(k):rows.push({...k,v:Math.min(20,Math.max(0,+i.value))})});
 if(rows.length&&err((await sb.from('grades').upsert(rows,{onConflict:'sub,stu,tri,t'})).error))return;
 for(const k of gone)await sb.from('grades').delete().match(k);
 db.grades=await fetchAll('grades');alert('Notes enregistrées ✔');render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
