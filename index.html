<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Scolaria – Notes & Bulletins</title>
<style>
:root{--p:#0f766e;--a:#f59e0b;--bg:#f4f7f6;--c:#fff;--t:#16302d;--m:#64807c;--b:#d9e4e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--c:#162826;--t:#e4f0ee;--m:#8fb0ab;--b:#27403d}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:18px}header small{opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--c);border-bottom:1px solid var(--b)}
nav button{white-space:nowrap;border:0;background:none;color:var(--m);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--p);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);max-width:100%}
button.b{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
button.d{background:none;border:0;color:#c0392b;cursor:pointer}
button.a{background:var(--a);color:#222}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-size:12px;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi div{background:var(--bg);border-radius:10px;padding:12px}.kpi b{font-size:26px;color:var(--p);display:block}
.login{max-width:360px;margin:8vh auto;text-align:center}.login input{width:100%;margin:5px 0}
.tag{background:var(--a);color:#222;border-radius:6px;padding:1px 7px;font-size:12px}
.num{width:70px}.bul h1{margin:0;color:var(--p);font-size:20px}.bul .hd{display:flex;justify-content:space-between;border-bottom:3px solid var(--p);padding-bottom:8px;margin-bottom:10px}
.red{color:#c0392b}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:10px}.g label{font-size:12px;color:var(--m)}.g input{width:100%;display:block;margin-top:2px}.ck label{display:inline-block;margin:2px 10px 2px 0;white-space:nowrap}td input{max-width:150px}
.bul{background:#fff;color:#000;font:13px Arial,sans-serif;padding:18px;margin:0 auto 14px;border:1px solid var(--b);max-width:794px}.bul *{text-transform:none}
.bh{display:grid;grid-template-columns:1.1fr 1.2fr .6fr;gap:10px;border-bottom:2px solid #bbb;padding-bottom:10px;margin-bottom:12px;line-height:1.6}.b1{display:flex;gap:10px;align-items:center}.b1 img{height:90px}.sn{font-size:20px}.bt1{font-size:17px;color:#555}.b3{text-align:right}.b3 img{height:90px;width:90px;object-fit:cover;border-radius:50%;margin-top:6px}
.bul table{border:2px solid #000}.bul th,.bul td{border:2px solid #000;padding:5px 6px;color:#000;font-size:13px}.bul th{font-size:15px;text-align:center}.bul td.c{text-align:center;font-weight:bold}.bul td.n{font-weight:bold}.bul td.t{font-size:10px}
.bf{display:grid;grid-template-columns:2.3fr 1fr;border:2px solid #000;margin-top:14px}.bfh{font-weight:bold;text-align:center;padding:9px;border-bottom:2px solid #000}.bf1{border-right:2px solid #000}.bfr{display:grid;grid-template-columns:1fr 2.2fr;border-bottom:2px solid #000}.bfr:last-child{border-bottom:0}.bfr span{padding:7px}.bfr span:first-child{border-right:2px solid #000}.sg{text-align:center;padding:8px}.sg img{max-height:80px;display:block;margin:0 auto}
@media print{@page{size:A4;margin:10mm}header,nav,.noprint{display:none!important}body{background:#fff;color:#000}main{padding:0}.card{border:0}.bul{border:0!important;max-width:none!important;padding:0!important;margin:0!important;break-after:page}.bul:last-child{break-after:auto}}
</style></head><body>

const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);

const LBL={home:'🏠 Accueil',config:'🏫 Établissement',schools:'🏢 Établissements',profs:'👨‍🏫 Enseignants',classes:'🏷️ Classes',eleves:'👥 Élèves',matieres:'📚 Matières',notes:'✏️ Saisie',bulletins:'📄 Bulletins',users:'🔑 Comptes'};
let S={u:null,reg:false,fc:'',cy:'Collège',tab:'home',as:'',tri:'1',title:'',cls:'',stu:''};

const myAs=()=>db.subjects.filter(s=>S.u.role!='prof'||s.teacher==S.u.id);

function gen(st,cls,tri){let n=0,d=0;db.subjects.filter(s=>s.cls==cls).forEach(s=>{const a=avgSub(st,s.id,tri);if(a!=null){n+=a*s.coef;d+=+s.coef}});return d?n/d:null}
const rank=(st,cls,tri)=>{const l=db.students.filter(x=>x.cls==cls).map(x=>gen(x.id,cls,tri)).filter(x=>x!=null).sort((a,b)=>b-a),m=gen(st,cls,tri);return m==null?null:l.indexOf(m)+1+'/'+l.length};
const appr=m=>m==null?'':m>=16?'Excellent travail, félicitations.':m>=14?'Très bons résultats, continuez ainsi.':m>=12?'Bon travail, ensemble satisfaisant.':m>=10?'Résultats satisfaisants, des efforts à poursuivre.':m>=8?'Résultats fragiles, un travail plus régulier est attendu.':'Résultats insuffisants, un net ressaisissement est nécessaire.';
const opt=(l,sel,fn)=>l.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(fn?fn(x):x.name)}</option>`).join('');

function render(){
 if(!S.u){$('app').innerHTML=`<div class="card login"><div style="font-size:44px">🎓</div><h2>Scolaria</h2><p style="color:var(--m)">Notes, carnets & bulletins</p><input id="lg" type="email" placeholder="Email" autocapitalize="none"><input id="pw" type="password" placeholder="Mot de passe"><button class="b" style="width:100%" onclick="login()">Se connecter</button><p id="er" class="red"></p><small style="color:var(--m)">Votre espace est créé par l'administrateur de la plateforme.</small></div>`;return}
 const tabs=TABS[S.u.role];if(!tabs.includes(S.tab))S.tab=tabs[0];
 $('app').innerHTML=`<header><div style="display:flex;gap:10px;align-items:center">${db.school.logo?`<img src="${db.school.logo}" height="38" style="border-radius:6px;background:#fff">`:'🎓'}<div><b>${esc(db.school.name||'Scolaria')}</b><br><small>${esc(S.u.name)} · ${ROLES[S.u.role]||'Super administrateur'}${db.school.year?' · '+esc(db.school.year):''}</small></div></div><button class="b a" onclick="logout()">Quitter</button></header>
 <nav>${tabs.map(t=>`<button class="${t==S.tab?'on':''}" onclick="S.tab='${t}';render()">${LBL[t]}</button>`).join('')}</nav><main>${V[S.tab]()}</main>`}

const V={
home(){const n=db.grades.length;return `<div class="card"><h2>Tableau de bord</h2><div class="kpi"><div><b>${db.students.length}</b>Élèves</div><div><b>${db.classes.length}</b>Classes</div><div><b>${db.subjects.length}</b>Affectations</div><div><b>${n}</b>Notes saisies</div></div></div>
 <div class="card"><h2>Moyennes par classe (année)</h2><table><tr><th>Classe</th><th>Effectif</th><th>Moyenne</th></tr>${db.classes.map(c=>{const st=db.students.filter(s=>s.cls==c.id);return `<tr><td>${esc(c.name)}</td><td>${st.length}</td><td><b>${f(mean(st.map(s=>gen(s.id,c.id,0)).filter(x=>x!=null)))}</b></td></tr>`}).join('')}</table></div>`},
config(){const s=db.school,F=(id,l,k,ty)=>`<label>${l}<input id="${id}" ${ty?`type="${ty}"`:''} value="${esc(s[k]||'')}"></label>`,IM=(l,key,v)=>`<label>${l}<input type="file" accept="image/*" onchange="pickImg(this,${key=='logo'?256:360},'${key}','image/png')"></label><p><img id="pv_${key}" src="${v||''}" height="64" style="${v?'':'display:none;'}background:#fff;border:1px solid var(--b)"></p>`;
 return `<div class="card"><h2>Informations de l'établissement</h2><div class="g">${F('sn',"Nom de l'établissement",'name')}${F('sy','Année scolaire (ex : 2026-2027)','year')}${F('sh','Responsable','head')}${F('st','Fonction du responsable (ex : Proviseur(e))','head_title')}${F('sp','Téléphone','phone','tel')}${F('se','Email','email','email')}${F('sa','Adresse','address')}${F('ss','Slogan','slogan')}</div><div class="g"><div>${IM('Logo','logo',s.logo)}</div><div>${IM('Signature du responsable (PNG, fond blanc ou transparent)','sig',s.signature)}</div></div><button class="b" onclick="saveConfig()">Enregistrer</button></div>`},
profs(){const P=db.users.filter(u=>u.role=='prof'),dl=[...new Set(Object.values(TPL).flat().map(x=>x[0]))];
 return `<div class="card"><h2>Nouvel enseignant</h2>${db.disciplines.length?'':`<p class="red">Ajoutez d'abord les matières dans l'onglet Matières.</p>`}${db.classes.length?'':`<p class="red">Créez d'abord des classes (onglet Classes) pour pouvoir affecter l'enseignant.</p>`}<div class="g"><label>Nom<input id="pn"></label><label>Discipline (matière enregistrée)<select id="pd"><option value="">Choisir…</option>${dopt()}</select></label><label>Téléphone<input id="pt" type="tel"></label><label>Email (identifiant)<input id="pe" type="email" autocapitalize="none"></label><label>Mot de passe (6+)<input id="pp" type="password"></label></div><p class="ck"><b>Classes :</b> ${db.classes.map(c=>`<label><input type="checkbox" class="nk" value="${c.id}"> ${esc(c.name)}</label>`).join('')||'—'}</p><button class="b" onclick="addProf()">Créer le compte</button></div>
 <div class="card"><h2>Enseignants (${P.length})</h2><div class="sc"><table><tr><th>Nom</th><th>Discipline</th><th>Contact</th><th>Classes affectées</th><th></th></tr>${P.map(p=>`<tr><td>${esc(p.name)}</td><td><select onchange="setProf('${p.id}',this.value)"><option value="">—</option>${dopt(p.discipline)}</select></td><td>${esc(p.login)}<br>${esc(p.phone||'')}</td><td class="ck">${db.classes.map(c=>`<label><input type="checkbox" ${db.subjects.some(s=>s.teacher==p.id&&s.cls==c.id)?'checked':''} onchange="toggleCls('${p.id}','${c.id}',this.checked)"> ${esc(c.name)}</label>`).join('')||'—'}</td><td><button class="d" onclick="del('profiles','${p.id}')">Retirer</button></td></tr>`).join('')}</table></div></div>`},
classes(){const P=db.users.filter(u=>u.role=='prof');
 return `<div class="card"><h2>Nouvelle classe</h2><div class="row"><select onchange="S.cy=this.value;render()">${Object.keys(LEVELS).map(c=>`<option ${c==S.cy?'selected':''}>${c}</option>`).join('')}</select><select id="cl">${LEVELS[S.cy].map(l=>`<option>${l}</option>`).join('')}</select><input id="cs" class="num" placeholder="Section"><input id="cc" class="num" type="number" placeholder="Eff. max"><select id="ct"><option value="">Prof. principal…</option>${opt(P)}</select></div><label><input type="checkbox" id="cx" checked> Créer les matières standard du cycle ${S.cy}</label> <button class="b" onclick="addClass()">Créer la classe</button></div>
 <div class="card"><h2>Classes (${db.classes.length})</h2><div class="sc"><table><tr><th>Classe</th><th>Cycle</th><th>Effectif</th><th>Prof. principal</th><th>Matières</th><th></th></tr>${db.classes.map(c=>{const n=db.students.filter(s=>s.cls==c.id).length;return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.cycle||'')}</td><td>${n}${c.capacity?' / '+c.capacity:''}</td><td><select onchange="setCls('${c.id}',this.value)"><option value="">—</option>${opt(P,c.head_teacher)}</select></td><td>${db.subjects.filter(s=>s.cls==c.id).length}</td><td><button class="d" onclick="del('classes','${c.id}')">Suppr.</button></td></tr>`}).join('')}</table></div></div>`},
eleves(){const L=db.students.filter(s=>!S.fc||s.cls==S.fc),e=db.students.find(x=>x.id==S.es)||{};
 return `<div class="card"><h2>${e.id?"Modifier l'élève":'Nouvel élève'}</h2>${db.classes.length?`<div class="g"><label>Nom complet<input id="ne" value="${esc(e.name||'')}"></label><label>Matricule<input id="nm" value="${esc(e.matricule||'')}"></label><label>Date de naissance<input id="nb" type="date" value="${e.birth||''}"></label><label>Classe<select id="nk">${opt(db.classes,e.cls||S.fc)}</select></label><label>Photo<input type="file" accept="image/*" onchange="pickImg(this,160,'photo','image/jpeg')"></label></div><p><img id="pv_photo" src="${e.photo||''}" height="56" style="${e.photo?'':'display:none'}"></p><button class="b" onclick="saveStu()">${e.id?'Enregistrer':'Ajouter'}</button>${e.id?` <button class="d" style="color:var(--m)" onclick="S.es='';S.photo=undefined;render()">Annuler</button>`:''}`:`<p class="red">Créez d'abord une classe.</p>`}</div>
 <div class="card"><div class="row"><select onchange="S.fc=this.value;render()"><option value="">Toutes les classes</option>${opt(db.classes,S.fc)}</select><span>${L.length} élève(s)</span></div><div class="sc"><table><tr><th>Matricule</th><th>Nom</th><th>Classe</th><th>Né(e) le</th><th></th></tr>${L.map(s=>`<tr><td>${esc(s.matricule||'')}</td><td>${esc(s.name)}</td><td>${esc(nm('classes',s.cls))}</td><td>${fd(s.birth)}</td><td><button class="d" style="color:var(--p)" onclick="S.es='${s.id}';S.photo=undefined;render();scrollTo(0,0)">✏️</button><button class="d" onclick="del('students','${s.id}')">Suppr.</button></td></tr>`).join('')}</table></div></div>`},
matieres(){const P=db.users.filter(u=>u.role=='prof'),to=s=>`<option value="">— non affectée —</option>${P.filter(p=>p.discipline==s.name||p.id==s.teacher).map(p=>`<option value="${p.id}" ${p.id==s.teacher?'selected':''}>${esc(p.name)}</option>`).join('')}`;
 return `<div class="card"><h2>Catalogue des matières</h2><div class="row"><input id="dn" placeholder="Nouvelle matière"><button class="b" onclick="add('disciplines',{name:$('dn').value.trim()})">Ajouter</button></div><p>${db.disciplines.map(d=>`<span class="tag">${esc(d.name)} <button class="d" onclick="del('disciplines','${d.id}')">×</button></span> `).join('')||'<span style="color:var(--m)">Aucune matière enregistrée.</span>'}</p></div>
 <div class="card"><h2>Matières par classe</h2>${db.classes.length&&db.disciplines.length?`<div class="row"><select id="mn">${db.disciplines.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select><input id="mc" class="num" type="number" value="1" min="0.5" step="0.5" title="Coefficient"><select id="mk">${opt(db.classes)}</select><button class="b" onclick="add('subjects',{name:$('mn').value,coef:+$('mc').value||1,cls:$('mk').value})">Ajouter à la classe</button></div>`:'<p class="red">Enregistrez d\'abord des matières et des classes.</p>'}<div class="sc"><table><tr><th>Matière</th><th>Classe</th><th>Coef</th><th>Enseignant (même discipline)</th><th></th></tr>${[...db.subjects].sort((a,b)=>nm('classes',a.cls).localeCompare(nm('classes',b.cls))).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(nm('classes',s.cls))}</td><td><input class="num" type="number" step="0.5" min="0.5" value="${s.coef}" onchange="setSub('${s.id}','coef',this.value)"></td><td><select onchange="setSub('${s.id}','teacher',this.value)">${to(s)}</select></td><td><button class="d" onclick="del('subjects','${s.id}')">Suppr.</button></td></tr>`).join('')}</table></div></div>`},
notes(){const A=myAs();if(!A.length)return '<div class="card">Aucune matière ne vous est affectée.</div>';if(!A.find(a=>a.id==S.as))S.as=A[0].id;const a=A.find(x=>x.id==S.as),st=db.students.filter(s=>s.cls==a.cls);
 const titles=[...new Set(db.grades.filter(g=>g.sub==a.id&&g.tri==S.tri).map(g=>g.t))];
 return `<div class="card"><h2>Saisie des notes</h2><div class="row"><select onchange="S.as=this.value;render()">${opt(A,S.as,x=>x.name+' – '+nm('classes',x.cls))}</select><select onchange="S.tri=this.value;render()">${[1,2,3].map(t=>`<option value="${t}" ${t==S.tri?'selected':''}>Trimestre ${t}</option>`).join('')}</select><input id="tt" list="tl" placeholder="Intitulé (ex : DS 1)" value="${esc(S.title)}" onchange="S.title=this.value;render()"><datalist id="tl">${titles.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
 ${S.title?`<div class="sc"><table><tr><th>Élève</th><th>Note /20</th></tr>${st.map(s=>{const g=db.grades.find(g=>g.sub==a.id&&g.stu==s.id&&g.tri==S.tri&&g.t==S.title);return `<tr><td>${esc(s.name)}</td><td><input class="num" type="number" min="0" max="20" step="0.25" data-s="${s.id}" value="${g?g.v:''}"></td></tr>`}).join('')}</table></div><p><button class="b" onclick="saveGr()">Enregistrer</button></p>`:'<p style="color:var(--m)">Saisissez un intitulé de devoir pour afficher la liste.</p>'}</div>
 <div class="card"><h2>Moyennes T${S.tri}</h2><table><tr><th>Élève</th><th>Moyenne</th></tr>${st.map(s=>`<tr><td>${esc(s.name)}</td><td>${f(avgSub(s.id,a.id,S.tri))}</td></tr>`).join('')}</table></div>`},
bulletins(){if(!db.classes.find(c=>c.id==S.cls))S.cls=(db.classes[0]||{}).id;const st=db.students.filter(s=>s.cls==S.cls);if(!st.find(s=>s.id==S.stu))S.stu=(st[0]||{}).id;const s=st.find(x=>x.id==S.stu),T=+S.tri,b=(T&&s&&db.binfo.find(x=>x.stu==s.id&&x.tri==T))||{};
 return `<div class="card noprint"><h2>Bulletins scolaires</h2><div class="row"><select onchange="S.cls=this.value;render()">${opt(db.classes,S.cls)}</select><select onchange="S.stu=this.value;render()">${opt(st,S.stu)}</select><select onchange="S.tri=this.value;render()">${[1,2,3,0].map(t=>`<option value="${t}" ${t==T?'selected':''}>${t?'Trimestre '+t:'Annuel'}</option>`).join('')}</select></div><div class="row"><button class="b a" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button><label><input type="checkbox" ${S.all?'checked':''} onchange="S.all=this.checked;render()"> Tous les élèves de la classe</label></div>${s&&T&&!S.all?`<div class="g"><label>Absences (heures)<input id="ba" type="number" min="0" value="${b.absences??''}"></label><label>Appréciation globale (vide = automatique)<input id="bg" value="${esc(b.appreciation||'')}"></label><label>Absences & conduite<input id="bc" value="${esc(b.conduite||'')}"></label></div><button class="b" onclick="saveBi()">Enregistrer</button>`:''}</div>${S.all?st.map(x=>bul(x)).join(''):s?bul(s):''}`},
users(){const U=db.users.filter(u=>u.role!='prof');return `<div class="card"><h2>Comptes administration</h2><div class="row"><input id="un" placeholder="Nom"><input id="ul" type="email" placeholder="Email" autocapitalize="none"><input id="up" type="password" placeholder="Mot de passe (6+)"><select id="ur"><option value="direction">Administration</option><option value="admin">Administrateur</option></select><button class="b" onclick="addUser()">Créer</button></div><div class="sc"><table><tr><th>Nom</th><th>Email</th><th>Rôle</th><th></th></tr>${U.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.login)}</td><td><select onchange="setRole('${u.id}',this.value)" ${u.id==S.u.id?'disabled':''}>${Object.entries({...ROLES,pending:'En attente'}).map(([k,v])=>`<option value="${k}" ${k==u.role?'selected':''}>${v}</option>`).join('')}</select></td><td>${u.id==S.u.id?'':`<button class="d" onclick="del('profiles','${u.id}')">Retirer</button>`}</td></tr>`).join('')}</table></div></div>`},
schools(){return `<div class="card"><h2>Nouvel établissement</h2><div class="g"><label>Nom de l'établissement<input id="xn"></label><label>Responsable (administrateur)<input id="xh"></label><label>Année scolaire<input id="xy" placeholder="2026-2027"></label><label>Email de l'administrateur<input id="xe" type="email" autocapitalize="none"></label><label>Mot de passe (6+)<input id="xp" type="password"></label></div><button class="b" onclick="addSchool()">Créer l'établissement</button></div>
 <div class="card"><h2>Établissements (${db.schools.length})</h2><div class="sc"><table><tr><th>Établissement</th><th>Année</th><th>Administrateur</th><th>Statut</th><th></th></tr>${db.schools.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.year||'')}</td><td>${db.users.filter(u=>u.school_id==s.id&&u.role=='admin').map(u=>esc(u.login)).join('<br>')}</td><td><button class="b ${s.active?'':'a'}" title="Cliquer pour changer" onclick="setActive('${s.id}',${!s.active})">${s.active?'Actif':'Suspendu'}</button></td><td><button class="d" onclick="delSchool('${s.id}')">Supprimer</button></td></tr>`).join('')}</table></div></div>`}
};
const err=e=>{if(e){alert(e.message||e);return true}};
async function fetchAll(t){let a=[],i=0;for(;;){const{data,error}=await sb.from(t).select('*').range(i,i+999);if(error)throw error;a=a.concat(data);if(data.length<1000)return a;i+=1000}}
async function loadAll(){const[u,c,s,m,g,sc,di,bi]=await Promise.all(['profiles','classes','students','subjects','grades','schools','disciplines','bulletin_info'].map(fetchAll));const su=S.u&&S.u.role=='super';db={users:u,classes:c,students:s,subjects:m,grades:g,school:su?{}:(sc[0]||{}),schools:sc,disciplines:di,binfo:bi};document.title=db.school.name||'Scolaria'}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('lg').value.trim(),password:$('pw').value});if(error)return $('er').textContent='Identifiants incorrects';enter()}
async function enter(){const{data:{user}}=await sb.auth.getUser();const{data:p}=user?await sb.from('profiles').select('*').eq('id',user.id).maybeSingle():{};let m="Compte non activé : contactez l'administrateur.";
 if(p&&TABS[p.role]){S.u=p;try{await loadAll()}catch(e){err(e)}if(p.role=='super'||db.school.id){S.tab=TABS[p.role][0];return render()}m="Établissement suspendu ou introuvable : contactez l'administrateur de la plateforme."}
 await sb.auth.signOut();S.u=null;render();const e=$('er');if(e)e.textContent=m}
async function logout(){await sb.auth.signOut();S.u=null;render()}
async function add(l,o){if(!o.name)return;const{data,error}=await sb.from(l).insert(o).select().single();if(err(error))return;db[l].push(data);render()}
async function del(l,id){if(!confirm('Supprimer ?'))return;const r=l=='profiles'?await sb.rpc('remove_user',{uid:id}):await sb.from(l).delete().eq('id',id);if(err(r.error))return;await loadAll();render()}
async function setRole(id,role){if(err((await sb.from('profiles').update({role}).eq('id',id)).error))return;await loadAll();render()}
const dopt=v=>db.disciplines.map(d=>`<option ${d.name==v?'selected':''}>${esc(d.name)}</option>`).join('');
async function tmpSignUp(email,password,name){const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const{data,error}=await tmp.auth.signUp({email,password,options:{data:{name}}});if(err(error))return;return data}
async function mkUser(email,password,name,role,phone,disc){const d=await tmpSignUp(email,password,name);if(!d)return;
 if(err((await sb.rpc('adopt_user',{uid:d.user.id,urole:role,uname:name,uphone:phone||null,udisc:disc||null})).error))return;return d.user.id}
async function addUser(){const e=$('ul').value.trim(),p=$('up').value,n=$('un').value.trim()||e;if(!e||p.length<6)return alert('Email et mot de passe (6 caractères min.) requis');if(await mkUser(e,p,n,$('ur').value)){await loadAll();render()}}
async function addSchool(){const e=$('xe').value.trim(),p=$('xp').value,n=$('xn').value.trim(),h=$('xh').value.trim();if(!n||!e||p.length<6)return alert("Nom, email et mot de passe (6 caractères min.) requis");
 const d=await tmpSignUp(e,p,h||e);if(!d)return;if(err((await sb.rpc('sa_create_school',{uid:d.user.id,sname:n,head:h,syear:$('xy').value.trim()||null})).error))return;await loadAll();render()}
async function setActive(id,v){err((await sb.from('schools').update({active:v}).eq('id',id)).error);await loadAll();render()}
async function delSchool(id){if(!confirm('Supprimer cet établissement et TOUTES ses données (comptes inclus) ?'))return;err((await sb.rpc('sa_delete_school',{sid:id})).error);await loadAll();render()}
const ord=r=>r==1?'1er':r+'ème',fd=d=>d?d.split('-').reverse().join('/'):'';
const aprS=m=>m==null?'':m>=16?'Excellent !':m>=14?'Très bien':m>=12?'Bien':m>=10?"Moyen, doit fournir plus d'effort":m>=8?'Travail insuffisant, des efforts sont attendus !':m>=3?'Faible, doit progresser davantage':'Abandon';
const aprG=m=>m==null?'':m>=16?'Excellents résultats, félicitations':m>=14?'Très bons résultats, continuez ainsi':m>=12?'Bons résultats':m>=10?'Résultats satisfaisants, doit poursuivre ses efforts':"Résultats insuffisants, doit fournir plus d'effort";
function bul(s){const T=+S.tri,sc=db.school,c=db.classes.find(x=>x.id==s.cls)||{},cs=db.students.filter(x=>x.cls==s.cls),m=gen(s.id,s.cls,T),b=(T&&db.binfo.find(x=>x.stu==s.id&&x.tri==T))||{},r=rank(s.id,s.cls,T),
 sa=db.subjects.filter(x=>x.cls==s.cls).map(x=>{const a=avgSub(s.id,x.id,T),L=cs.map(y=>avgSub(y.id,x.id,T)).filter(v=>v!=null).sort((p,q)=>q-p);return `<tr><td class="n">${esc(x.name)}</td><td class="t">${esc(nm('users',x.teacher))}</td><td class="c">${db.grades.filter(g=>g.stu==s.id&&g.sub==x.id&&(!T||g.tri==T)).length}</td><td class="c">${a==null?'–':L.indexOf(a)+1}</td><td class="c">${f(a)}</td><td class="c">${f(mean(L))}</td><td class="t">${aprS(a)}</td></tr>`}).join('');
 return `<div class="bul"><div class="bh"><div class="b1">${sc.logo?`<img src="${sc.logo}">`:''}<div><div class="sn">${esc(sc.name||'')}</div><div><b>Téléphone:</b> ${esc(sc.phone||'')}</div><div><b>E-mail:</b> ${esc(sc.email||'')}</div><div><b>Année scolaire:</b> ${esc(sc.year||'')}</div></div></div><div><div class="bt1">Bulletin ${T?'du Trimestre '+T:'Annuel'}</div><div>${esc(s.matricule||'')}</div><div><b>${esc(s.name.toUpperCase())}</b></div><div><b>Né (e) :</b> ${fd(s.birth)}</div><div><b>${esc(c.name||'')}</b> (${cs.length})</div><div><b>Professeur Principal:</b> ${esc(nm('users',c.head_teacher))}</div></div><div class="b3"><div><b>Le :</b> ${new Date().toLocaleDateString('fr-FR').replace(/\//g,'-')}</div>${s.photo?`<img src="${s.photo}">`:''}</div></div>
<table><tr><th rowspan="2">matière</th><th rowspan="2">Enseignant</th><th rowspan="2">NB Note</th><th rowspan="2">Rang</th><th colspan="2">Moyennes</th><th rowspan="2">Appréciation</th></tr><tr><th>Élève</th><th>Classe</th></tr>${sa}<tr><td colspan="3" style="text-align:center">Moyenne Générale</td><td class="c">${r?ord(+r.split('/')[0]):'–'}</td><td class="c">${f(m)}</td><td class="c">${f(mean(cs.map(y=>gen(y.id,s.cls,T)).filter(v=>v!=null)))}</td><td></td></tr></table>
<div class="bf"><div class="bf1"><div class="bfh">APPRECIATION DU CONSEIL DE CLASSE</div><div class="bfr"><span>Absences</span><span>${b.absences!=null?b.absences+' heure (s)':''}</span></div><div class="bfr"><span>Appréciation globale</span><span>${esc(b.appreciation||aprG(m))}</span></div><div class="bfr"><span>Absences & Conduite</span><span>${esc(b.conduite||'')}</span></div></div><div><div class="bfh">SIGNATURE & CACHET</div><div class="sg">${sc.signature?`<img src="${sc.signature}">`:''}<div>${esc(sc.head_title||'Le Responsable')}</div><small>${esc(sc.head||'')}</small></div></div></div></div>`}
async function assign(p,c,on){if(on){const f=db.subjects.find(s=>s.cls==c&&!s.teacher&&s.name==p.discipline);return f?(await sb.from('subjects').update({teacher:p.id}).eq('id',f.id)).error:(await sb.from('subjects').insert({name:p.discipline,coef:1,cls:c,teacher:p.id})).error}
 return (await sb.from('subjects').update({teacher:null}).match({teacher:p.id,cls:c})).error}
async function toggleCls(t,c,on){const p=db.users.find(u=>u.id==t);if(on&&!p.discipline){alert("Renseignez d'abord la discipline de l'enseignant");return render()}err(await assign(p,c,on));await loadAll();render()}
async function addProf(){const email=$('pe').value.trim(),password=$('pp').value,name=$('pn').value.trim(),dis=$('pd').value.trim();if(!email||!name||password.length<6)return alert('Nom, email et mot de passe (6 caractères min.) requis');
 const id=await mkUser(email,password,name,'prof',$('pt').value,dis);if(!id)return;await loadAll();const p=db.users.find(u=>u.id==id);
 if(p&&dis)for(const c of [...document.querySelectorAll('.nk:checked')].map(x=>x.value))err(await assign(p,c,true));await loadAll();render()}
async function setProf(id,v){err((await sb.from('profiles').update({discipline:v.trim()||null}).eq('id',id)).error);await loadAll();render()}
async function setSub(id,k,v){err((await sb.from('subjects').update({[k]:k=='coef'?(+v||1):(v||null)}).eq('id',id)).error);await loadAll();render()}
async function setCls(id,v){err((await sb.from('classes').update({head_teacher:v||null}).eq('id',id)).error);await loadAll();render()}
async function addClass(){const lv=$('cl').value,sec=$('cs').value.trim();const{data,error}=await sb.from('classes').insert({name:lv+(sec?' '+sec:''),level:lv,cycle:S.cy,section:sec,capacity:+$('cc').value||null,head_teacher:$('ct').value||null}).select().single();if(err(error))return;
 if($('cx').checked){const nw=TPL[S.cy].map(x=>x[0]).filter(n=>!db.disciplines.some(d=>d.name==n));if(nw.length)err((await sb.from('disciplines').insert(nw.map(name=>({name})))).error);err((await sb.from('subjects').insert(TPL[S.cy].map(([name,coef])=>({name,coef,cls:data.id})))).error)}await loadAll();render()}
async function saveConfig(){const o={name:$('sn').value.trim(),year:$('sy').value.trim(),head:$('sh').value.trim(),head_title:$('st').value.trim(),phone:$('sp').value.trim(),email:$('se').value.trim(),address:$('sa').value.trim(),slogan:$('ss').value.trim()};if(!o.name)return alert("Le nom de l'établissement est obligatoire");if(S.logo!==undefined)o.logo=S.logo;if(S.sig!==undefined)o.signature=S.sig;
 if(err((await sb.from('schools').update(o).eq('id',db.school.id)).error))return;S.logo=S.sig=undefined;await loadAll();alert('Configuration enregistrée ✔');render()}
function pickImg(i,max,key,type){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');if(type=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);S[key]=c.toDataURL(type,.85);const p=$('pv_'+key);if(p){p.src=S[key];p.style.display=''}};im.src=r.result};r.readAsDataURL(f)}
async function saveStu(){const o={name:$('ne').value.trim(),matricule:$('nm').value.trim()||null,birth:$('nb').value||null,cls:$('nk').value||null};if(!o.name)return;if(S.photo)o.photo=S.photo;
 const q=S.es?sb.from('students').update(o).eq('id',S.es):sb.from('students').insert(o);if(err((await q).error))return;S.es='';S.photo=undefined;await loadAll();render()}
async function saveBi(){const o={stu:S.stu,tri:+S.tri,absences:$('ba').value===''?null:+$('ba').value,appreciation:$('bg').value.trim()||null,conduite:$('bc').value.trim()||null};if(err((await sb.from('bulletin_info').upsert(o,{onConflict:'stu,tri'})).error))return;await loadAll();alert('Enregistré ✔');render()}
async function saveGr(){const rows=[],gone=[];document.querySelectorAll('input[data-s]').forEach(i=>{const k={sub:S.as,stu:i.dataset.s,tri:+S.tri,t:S.title};i.value===''?gone.push(k):rows.push({...k,v:Math.min(20,Math.max(0,+i.value))})});
 if(rows.length&&err((await sb.from('grades').upsert(rows,{onConflict:'sub,stu,tri,t'})).error))return;
 for(const k of gone)await sb.from('grades').delete().match(k);
 db.grades=await fetchAll('grades');alert('Notes enregistrées ✔');render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{const{data:{session}}=await sb.auth.getSession();session?enter():render()})();
</script></body></html>
